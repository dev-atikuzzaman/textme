<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fbf9" />
    <script>
      (function () { try {
        var t = localStorage.getItem('apon-theme') || 'light', f = localStorage.getItem('apon-font') || 'md';
        var d = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement; r.dataset.theme = d ? 'dark' : 'light';
        r.style.fontSize = ({ sm: 16, md: 18, lg: 20, xl: 22 }[f] || 18) + 'px';
        var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', d ? '#0d1512' : '#f8fbf9');
        var c = document.querySelector('meta[name=color-scheme]'); if (c) c.setAttribute('content', d ? 'dark' : 'light');
      } catch (e) {} })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="বন্ধু" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>বন্ধু</title>
    <link rel="preload" href="/fonts/Kalpurush.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
